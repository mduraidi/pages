<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Localhost Timing Probe</title>
<style>
body {
    font-family: system-ui, sans-serif;
    margin: 30px;
}
button {
    padding: 10px 18px;
}
table {
    border-collapse: collapse;
    margin-top:20px;
}
th, td {
    border:1px solid #ccc;
    padding:6px 12px;
}
pre {
    background:#f4f4f4;
    padding:12px;
}
</style>
</head>
<body>

<h2>Localhost Timing Probe</h2>

<button id="run">Probe</button>

<pre id="log"></pre>

<table id="table">
<thead>
<tr>
<th>Port</th>
<th>Median (ms)</th>
<th>Min</th>
<th>Max</th>
<th>Samples</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>

const PORTS = [
3000,
4000,
5000,
8080,
9090,
9222
];

const ROUNDS = 25;

async function probe(port){

    const t0 = performance.now();

    try{
        await fetch(`http://127.0.0.1:${port}/`,{
            mode:"no-cors",
            cache:"no-store"
        });
    }catch(e){
    }

    return performance.now()-t0;
}

function median(arr){
    arr=[...arr].sort((a,b)=>a-b);
    return arr[Math.floor(arr.length/2)];
}

document.getElementById("run").onclick = async ()=>{

    const tbody=document.querySelector("#table tbody");
    tbody.innerHTML="";

    const output=[];

    for(const port of PORTS){

        const samples=[];

        for(let i=0;i<ROUNDS;i++){

            samples.push(await probe(port));

            await new Promise(r=>setTimeout(r,50));
        }

        output.push({
            port,
            median:median(samples),
            min:Math.min(...samples),
            max:Math.max(...samples),
            samples
        });

    }

    for(const r of output){

        const tr=document.createElement("tr");

        tr.innerHTML=`
        <td>${r.port}</td>
        <td>${r.median.toFixed(2)}</td>
        <td>${r.min.toFixed(2)}</td>
        <td>${r.max.toFixed(2)}</td>
        <td>${r.samples.length}</td>
        `;

        tbody.appendChild(tr);
    }

    document.getElementById("log").textContent =
        JSON.stringify(output,null,2);

    console.log(output);

};

</script>

</body>
</html>
