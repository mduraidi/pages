<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Diagnostic Report Generator</title>

<style>
body{
    font-family:system-ui,sans-serif;
    margin:30px;
}

textarea{
    width:100%;
    height:220px;
    font-family:monospace;
}

pre{
    background:#f5f5f5;
    padding:15px;
    white-space:pre-wrap;
}

button{
    padding:10px 18px;
    margin:8px 0;
}
</style>
</head>
<body>

<h2>Diagnostic Report Generator</h2>

<p>Paste the JSON produced by one of the diagnostic pages.</p>

<textarea id="input"></textarea>

<br>

<button id="generate">Generate Markdown</button>
<button id="copy">Copy Report</button>

<h3>Markdown</h3>

<pre id="output"></pre>

<script>

let markdown="";

document.getElementById("generate").onclick=()=>{

    let obj;

    try{
        obj=JSON.parse(
            document.getElementById("input").value
        );
    }catch(e){
        alert("Invalid JSON");
        return;
    }

    let out=[];

    out.push("# Browser Diagnostic Report");
    out.push("");

    out.push("Generated: "+new Date().toISOString());
    out.push("");

    out.push("## Environment");
    out.push("");

    for(const [k,v] of Object.entries(obj)){
        out.push(`- **${k}**: ${v}`);
    }

    out.push("");

    out.push("## Notes");
    out.push("");
    out.push("- Browser behavior reproduced locally.");
    out.push("- Measurements gathered using standard browser APIs.");
    out.push("- Attach raw JSON alongside this report.");

    markdown=out.join("\n");

    document.getElementById("output").textContent=
        markdown;

};

document.getElementById("copy").onclick=async()=>{

    if(!markdown) return;

    await navigator.clipboard.writeText(markdown);

    alert("Copied.");

};

</script>

</body>
</html>
